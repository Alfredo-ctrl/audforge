[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audforge"
version = "0.1.0"
description = "Professional audio editing toolkit built for AI agents. CLI, Python API and MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Alfredo Ramos"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
audforge = "audforge.cli:main"

[tool.setuptools.packages.find]
include = ["audforge*"]
