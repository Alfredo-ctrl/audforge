[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audforge"
version = "0.1.0"
description = "Audio edits as a list of ops over ffmpeg: trim, normalize, fades, format conversion."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia",
]

authors = [{name = "Alfredo Ramos"}]

requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Alfredo-ctrl/audforge"
Repository = "https://github.com/Alfredo-ctrl/audforge"

[project.scripts]
audforge = "audforge.cli:main"

[tool.setuptools.packages.find]
include = ["audforge*", "forge_common*"]

[dependency-groups]
dev = ["pytest>=8"]
